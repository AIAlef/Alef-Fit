<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alef.Fit — Google sign-in code</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b0d10; color: #f0f3f7;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  .card { max-width: 420px; padding: 28px 22px; text-align: center; }
  h1 { font-size: 1.1rem; margin: 0 0 6px; }
  p { color: #93a0af; font-size: .9rem; }
  #code { font-family: ui-monospace, monospace; font-size: 1.05rem; word-break: break-all;
          background: #15181d; border: 1px solid #232932; border-radius: 12px; padding: 14px; margin: 14px 0; }
  button { background: #4d9aff; color: #071528; border: 0; border-radius: 10px;
           padding: 12px 22px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .err { color: #f06a6e; }
</style>
</head>
<body>
<div class="card">
  <h1>Alef.Fit — Google sign-in</h1>
  <div id="out"></div>
</div>
<script>
'use strict';
(function () {
  var q = new URLSearchParams(location.search);
  var out = document.getElementById('out');
  var code = q.get('code');
  if (code) {
    /* v0.61: ONE button — copy the code, then switch back to the app;
       Alef.Fit reads the clipboard on return and fills the box itself. */
    out.innerHTML = '<p>Tap the button, then switch back to the <b>Alef.Fit</b> app — the code fills in by itself:</p>' +
      '<div id="code"></div><button id="cp">Copy code — return to Alef.Fit</button><p id="ok"></p>';
    document.getElementById('code').textContent = code;
    document.getElementById('cp').addEventListener('click', function () {
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () {
        document.getElementById('ok').innerHTML = 'Copied ✓ — jumping back to <b>Alef.Fit</b>… ' +
          '(if nothing happens: recent-apps or Back. The code pastes itself into the box; ' +
          'if not, long-press the box and Paste.)';
        /* v0.63: actually RETURN to the app — an Android intent URL that
           foregrounds the installed Alef.Fit APK (no custom scheme
           needed; on other platforms it is a harmless no-op). */
        setTimeout(function () {
          try {
            location.href = 'intent:#Intent;action=android.intent.action.MAIN;' +
              'category=android.intent.category.LAUNCHER;package=fit.alef.app;end';
          } catch (e) { /* stay on this page */ }
          setTimeout(function () { try { window.close(); } catch (e2) { /* tab stays — fine */ } }, 600);
        }, 350);
      }, function () {
        document.getElementById('ok').textContent = 'Long-press the code to copy it, then return to Alef.Fit';
      });
    });
  } else {
    out.innerHTML = '<p class="err">' + (q.get('error') ? 'Google returned: ' + q.get('error') : 'No code in the address — start the sign-in from the Alef.Fit app.') + '</p>';
  }
})();
</script>
</body>
</html>
